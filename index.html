<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCA M.G. Piansano — Presenti</title>
<meta name="description" content="Elenco dei presenti — MCA M.G. Piansano">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --text: #1c1b19;
    --muted: #8a857c;
    --line: #e6e1d8;
    --accent: #9a7b4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --surface: #1c1b19;
      --text: #f1ede6;
      --muted: #8f8a82;
      --line: #2c2a27;
      --accent: #c9a875;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 64px 16px 48px;
  }
  main { max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 40px; }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(34px, 8vw, 48px);
    line-height: 1.05;
    letter-spacing: -.01em;
  }
  .sub {
    margin-top: 12px;
    color: var(--muted);
    font-size: 14px;
  }
  .search {
    width: 100%;
    padding: 14px 16px;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color .2s;
  }
  .search:focus { border-color: var(--accent); }
  ol {
    list-style: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  li {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 15px 20px;
    border-top: 1px solid var(--line);
    font-size: 16px;
  }
  li:first-child { border-top: 0; }
  li .n {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 18px;
    color: var(--muted);
    min-width: 24px;
    text-align: right;
  }
  li .dot {
    margin-left: auto;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .8;
  }
  li.hidden { display: none; }
  .empty {
    display: none;
    text-align: center;
    color: var(--muted);
    padding: 24px;
    font-size: 14px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 32px;
    letter-spacing: .04em;
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Piansano</p>
    <h1>MCA M.G.</h1>
    <p class="sub"><span id="count">25</span> presenti</p>
  </header>

  <input class="search" id="search" type="search" placeholder="Cerca un nome…" aria-label="Cerca un nome">

  <ol id="list"></ol>
  <p class="empty" id="empty">Nessun risultato</p>

  <footer>MCA M.G. Piansano</footer>
</main>

<script>
  const people = [
    "Mattia Gipsi", "Elena Virtuoso", "Giacomo Parri", "Tommaso Parri",
    "Simone Zamboni", "Greta Bassanelli", "Anna De Paolis", "Damiano Scoccia",
    "Gabriele Sensoni", "Michela Di Francesco", "Angelo Papacchini", "Giorgia Burlini",
    "Matilde Melaragni", "Gianmarco Moscatelli", "Matilde Trudini", "Gabriele Lucci",
    "Alessandra Lucci", "Martina Gipsi", "Francesca Bocci", "Livia Falesiedi",
    "Federico Mattei", "Samuele Saralli", "Giorgia Massieri", "Cristiana Biagini",
    "Leonardo Mezzetti"
  ];

  const list = document.getElementById("list");
  const count = document.getElementById("count");
  const empty = document.getElementById("empty");

  people.forEach((name, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="n">${i + 1}</span><span class="name"></span><span class="dot"></span>`;
    li.querySelector(".name").textContent = name;
    li.dataset.name = name.toLowerCase();
    list.appendChild(li);
  });
  count.textContent = people.length;

  document.getElementById("search").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    let visible = 0;
    list.querySelectorAll("li").forEach(li => {
      const show = li.dataset.name.includes(q);
      li.classList.toggle("hidden", !show);
      if (show) visible++;
    });
    empty.style.display = visible ? "none" : "block";
    list.style.display = visible ? "" : "none";
  });
</script>
</body>
</html>
